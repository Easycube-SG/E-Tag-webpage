<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <rect width="1200" height="320" fill="#f0f4fa"/>
  <!-- Step connectors -->
  <line x1="220" y1="160" x2="380" y2="160" stroke="#d8e1ee" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="520" y1="160" x2="680" y2="160" stroke="#d8e1ee" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="820" y1="160" x2="980" y2="160" stroke="#d8e1ee" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Step 1: Scan -->
  <g transform="translate(80, 60)">
    <rect width="200" height="200" rx="16" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
    <circle cx="100" cy="55" r="28" fill="#1976d2"/>
    <text x="100" y="62" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">1</text>
    <rect x="60" y="100" width="80" height="100" rx="10" fill="#182230"/>
    <rect x="68" y="110" width="64" height="70" rx="4" fill="#e8f1fb"/>
    <rect x="78" y="125" width="44" height="30" rx="3" fill="#fff" stroke="#1976d2" stroke-width="2"/>
    <text x="100" y="215" text-anchor="middle" fill="#1e3a5f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Scan Parcel</text>
  </g>

  <!-- Step 2: Tag -->
  <g transform="translate(380, 60)">
    <rect width="200" height="200" rx="16" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
    <circle cx="100" cy="55" r="28" fill="#1976d2"/>
    <text x="100" y="62" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">2</text>
    <rect x="70" y="95" width="60" height="45" rx="6" fill="#fff" stroke="#667085" stroke-width="2"/>
    <circle cx="130" cy="115" r="12" fill="#4caf50"/>
    <circle cx="130" cy="115" r="22" fill="#4caf50" opacity="0.25"/>
    <path d="M130 95 L130 80 M118 88 L130 80 L142 88" stroke="#4caf50" stroke-width="2" fill="none"/>
    <text x="100" y="215" text-anchor="middle" fill="#1e3a5f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Assign BLE Tag</text>
  </g>

  <!-- Step 3: Store -->
  <g transform="translate(680, 60)">
    <rect width="200" height="200" rx="16" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
    <circle cx="100" cy="55" r="28" fill="#1976d2"/>
    <text x="100" y="62" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="600">3</text>
    <rect x="55" y="100" width="90" height="70" rx="6" fill="#e8f1fb" stroke="#d8e1ee" stroke-width="2"/>
    <rect x="65" y="115" width="35" height="25" rx="3" fill="#fff"/>
    <rect x="105" y="120" width="30" height="20" rx="3" fill="#fff"/>
    <circle cx="82" cy="108" r="6" fill="#4caf50"/>
    <path d="M145 130 L165 130 L165 150 L145 150Z" fill="#1976d2" opacity="0.3"/>
    <path d="M155 135 L160 145 L150 145Z" fill="#1976d2"/>
    <text x="100" y="215" text-anchor="middle" fill="#1e3a5f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Store &amp; Sync</text>
  </g>

  <!-- Step 4: Retrieve -->
  <g transform="translate(980, 60)">
    <rect width="200" height="200" rx="16" fill="#fff" stroke="#d8e1ee" stroke-width="2"/>
    <circle cx="100" cy="55" r="28" fill="#1976d2"/>
    <text x="100" y="62" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">4</text>
    <circle cx="100" cy="140" r="40" fill="#4caf50" opacity="0.15"/>
    <circle cx="100" cy="140" r="28" fill="#4caf50" opacity="0.3"/>
    <circle cx="100" cy="140" r="16" fill="#4caf50"/>
    <rect x="82" y="175" width="36" height="20" rx="4" fill="#fff" stroke="#667085" stroke-width="1.5"/>
    <text x="100" y="215" text-anchor="middle" fill="#1e3a5f" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Retrieve Fast</text>
  </g>
</svg>
